<!DOCTYPE html>
<html lang="en" data-theme="blue">
  <head>
    <!-- Original PPP frontend (earth topology / bump reference): https://github.com/7Magic7Mike7/pain-website -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P.A.I.N. - Personal And Interconnected with Nature</title>
  </head>
  <body>
    <div id="app">
      <canvas id="globe"></canvas>
      <div id="ui-title"></div>
      <div id="ui-title-controls"></div>
      <div id="ui-layer-stack"></div>
      <div id="ui-top-right"></div>
      <div id="ui-share-pain"></div>
      <div id="ui-bottom-left"></div>
      <div id="ui-legend"></div>
      <p id="status" class="status" aria-live="polite" hidden></p>
      <button type="button" id="word-cloud-toggle" class="word-cloud-toggle" hidden></button>
      <div id="survey-modal"></div>
      <button
        type="button"
        id="globe-debug-toggle"
        class="globe-debug-entry"
        hidden
        aria-expanded="false"
        aria-controls="globe-debug-panel"
      >
        Debug
      </button>
      <div
        id="globe-debug-panel"
        class="globe-debug-panel-host globe-debug-panel-host--floating"
        hidden
        aria-label="Globe layer toggles (debug)"
      ></div>
      <canvas
        id="scar-map-preview"
        class="scar-map-preview"
        width="512"
        height="256"
        hidden
        title="Scar displacement height map (128 = neutral)"
      ></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
