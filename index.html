<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <!-- Original PPP frontend (earth topology / bump reference): https://github.com/7Magic7Mike7/pain-website -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAIN — Globe prototype</title>
  </head>
  <body>
    <div id="app">
      <div class="theme-bar">
        <button
          type="button"
          id="theme-toggle"
          class="theme-toggle"
          aria-pressed="false"
          title="Switch color theme"
        >
          Blue mode
        </button>
      </div>
      <canvas id="globe"></canvas>
      <aside id="hud" aria-label="Controls">
        <h1>PAIN prototype</h1>
        <label>
          Layer
          <select id="layer-select"></select>
        </label>
        <label>
          Pain data
          <select
            id="pain-viz-mode"
            title="Markers, stipple surface scars, or multiplex graph on the stipple globe"
          >
            <option value="points">Point markers</option>
            <option value="scars" selected>Scar dents (topology)</option>
            <option value="multiplex-v0">Multiplex v0 (experimental)</option>
          </select>
        </label>
        <p class="hint">Drag to orbit · scroll to zoom</p>
        <div class="row">
          <button type="button" id="refresh-points">Refresh points</button>
          <button type="button" id="test-post">Test POST</button>
          <button type="button" id="word-cloud-toggle" class="word-cloud-toggle">
            Word clouds: Off
          </button>
        </div>
        <p id="status" class="status"></p>
      </aside>
      <button
        type="button"
        id="globe-debug-toggle"
        class="globe-debug-entry"
        hidden
        aria-expanded="false"
        aria-controls="globe-debug-panel"
      >
        Debug
      </button>
      <div
        id="globe-debug-panel"
        class="globe-debug-panel-host globe-debug-panel-host--floating"
        hidden
        aria-label="Globe layer toggles (debug)"
      ></div>
      <canvas
        id="scar-map-preview"
        class="scar-map-preview"
        width="512"
        height="256"
        hidden
        title="Scar displacement height map (128 = neutral)"
      ></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
